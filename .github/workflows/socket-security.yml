name: socket-security

env:
  CI_NODE_VERSION: '20.17.0'
  CI_NPM_VERSION: '11.11.0'

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: socket-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-guard:
    name: Socket Firewall
    runs-on: ubuntu-latest
    steps:
      - uses: socketdev/action@v1
        with:
          mode: firewall
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - name: Upgrade npm
        run: |
          npm install --global npm@${CI_NPM_VERSION}
          npm --version
      - name: Install dependencies with Socket Firewall
        run: sfw npm ci

  dependency-scan:
    name: Socket Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Socket CLI
        run: pip install socketsecurity --upgrade
      - name: Run Socket Security Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${SOCKET_SECURITY_API_KEY:-}" ]; then
            echo "SOCKET_SECURITY_API_KEY not set; skipping Socket CLI scan."
            exit 0
          fi

          PR_NUMBER=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER=${{ github.event.pull_request.number }}
          fi

          socketcli \
            --target-path "$GITHUB_WORKSPACE" \
            --scm github \
            --pr-number "$PR_NUMBER"
